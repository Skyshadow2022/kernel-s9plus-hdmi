name: Kernel Build

# Full Image build is heavy; run manually from Actions → Run workflow.
# Needs ~30–90 min and downloads AOSP clang + aarch64 GCC.

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel make jobs"
        required: false
        default: "4"

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ARCH: arm64
      SUBARCH: arm64
      ANDROID_VERSION: "130000"
      ANDROID_MAJOR_VERSION: t
      CLANG_VERSION: "14.0.6-zy20260619"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex bc libssl-dev libelf-dev \
            python3 wget curl xz-utils build-essential

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            toolchains/clang
            toolchains/gcc-arm64
          key: tc-${{ env.CLANG_VERSION }}-gcc-gs49dp-r3

      - name: Fetch AOSP clang (if missing)
        run: |
          set -euo pipefail
          if [[ -x toolchains/clang/bin/clang ]]; then
            echo "clang cache hit"
            exit 0
          fi
          mkdir -p toolchains/clang
          # Lean prebuilt AOSP clang 14.0.6 (matches the clang the kernel was
          # originally built with). ZyCromerZ tarball has bin/ at archive root,
          # so extract WITHOUT --strip-components.
          URL="https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20260619-release/Clang-14.0.6-20260619.tar.gz"
          echo "Downloading clang 14.0.6 (ZyCromerZ)…"
          curl -L --fail --retry 3 -o /tmp/clang.tgz "$URL"
          tar -xzf /tmp/clang.tgz -C toolchains/clang
          test -x toolchains/clang/bin/clang

      - name: Fetch aarch64 GCC (if missing)
        run: |
          set -euo pipefail
          if [[ -x toolchains/gcc-arm64/bin/aarch64-linux-android-gcc ]]; then
            echo "gcc cache hit"
            exit 0
          fi
          mkdir -p toolchains/gcc-arm64
          # aarch64-linux-android-4.9 GCC binutils for CROSS_COMPILE, from the
          # googlesource prebuilt (real binaries, no LFS). This repo has no
          # master/main branch; use a real android13 4.9 branch that ships the
          # driver. googlesource +archive puts bin/ at root → no strip.
          URL="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android-arm64-deadpool-4.9-android13-tv.tar.gz"
          echo "Downloading aarch64-linux-android-4.9 GCC (googlesource)…"
          curl -L --fail --retry 3 -o /tmp/gcc.tgz "$URL"
          tar -xzf /tmp/gcc.tgz -C toolchains/gcc-arm64
          test -x toolchains/gcc-arm64/bin/aarch64-linux-android-gcc || \
            chmod -R +x toolchains/gcc-arm64/bin
          test -x toolchains/gcc-arm64/bin/aarch64-linux-android-gcc

      - name: Sanity
        run: bash scripts/ci_sanity.sh

      - name: Build Image + modules
        env:
          CLANG_BIN: ${{ github.workspace }}/toolchains/clang/bin
          GCC_BIN: ${{ github.workspace }}/toolchains/gcc-arm64/bin
          JOBS: ${{ inputs.jobs }}
        run: |
          export PATH="$CLANG_BIN:$GCC_BIN:$PATH"
          clang --version | head -2
          aarch64-linux-android-gcc --version | head -2
          # build_gkilike.sh expects a base out/.config and won't create one.
          # Generate it from the in-tree star2lte defconfig (build_gkilike then
          # layers the touch/kernelsu/displayport/perf fragments on top).
          make -C kernel_source O="$GITHUB_WORKSPACE/out" ARCH=arm64 \
            CC=clang CROSS_COMPILE=aarch64-linux-android- \
            CLANG_TRIPLE=aarch64-linux-gnu- exynos9810-star2lte_defconfig
          ./build_gkilike.sh

      - name: Upload flash zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-star2lte-gkilike
          path: |
            Kernel-star2lte-gkilike-*.zip
            Kernel-star2lte-gkilike-NEXT.zip
          if-no-files-found: warn
          retention-days: 14
